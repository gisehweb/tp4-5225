# Grupo de servidores del laboratorio. Para pruebas locales apunta a localhost.
[lab_systems]
localhost

[lab_systems:vars]
# Conexión local: Ansible ejecuta las tareas en la misma máquina, sin abrir SSH
ansible_connection=local
ansible_python_interpreter=/usr/bin/python3
# Elevación de privilegios con sudo (become: yes)
ansible_become=yes
ansible_become_method=sudo
# Usuario del sistema que podrá usar Docker sin sudo
usuario_lab=gisellah
