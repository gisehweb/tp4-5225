# TP4 - Automatización y Scripting - Gisella Henriquez (Legajo 5225)
# Orquestación de Nginx (servidor web) + GoAccess (analizador de logs)
services:
  log_analyzer:
    build: .                          # Imagen propia a partir del Dockerfile
    container_name: tp4-log_analyzer
    ports:
      - "7890:7890"                   # WebSocket de GoAccess (actualización en tiempo real)
    volumes:
      - ./goaccess.conf:/etc/goaccess/goaccess.conf:ro
      - logs:/srv/logs                # Lee el access.log que escribe Nginx
      - report:/srv/report            # Escribe report.html
    restart: unless-stopped

  web_server:
    image: nginx:alpine
    container_name: tp4-web_server
    depends_on:
      - log_analyzer
    ports:
      - "8025:80"                     # 8000 + 25 (últimos 2 dígitos del legajo): sitio web
      - "9025:9025"                   # 9000 + 25: reporte de GoAccess
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - logs:/srv/logs                # Escribe el access.log
      - report:/srv/report:ro         # Sirve el report.html generado por GoAccess
    restart: unless-stopped

volumes:
  logs:
  report:
