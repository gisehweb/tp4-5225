# Configuración de GoAccess - TP4 Gisella Henriquez (Legajo 5225)
# Archivo de log a analizar (lo escribe Nginx en el volumen compartido)
log-file /srv/logs/access.log
# Formato de log combinado (el que usa Nginx por defecto)
log-format COMBINED
# Reporte HTML estático, actualizado en tiempo real por WebSocket
output /srv/report/report.html
real-time-html true
port 7890
addr 0.0.0.0
# Título del reporte
html-report-title TP4 CURZA - Gisella Henriquez (5225)
