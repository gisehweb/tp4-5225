# Configuración de Nginx - TP4 Gisella Henriquez (Legajo 5225)

# Sitio web (puerto 80 del contenedor -> 8025 del host)
server {
    listen 80;
    server_name _;
    # Log en formato combinado dentro del volumen compartido con GoAccess
    access_log /srv/logs/access.log combined;
    root /usr/share/nginx/html;
    index index.html;
}

# Reporte de GoAccess (puerto 9025 del contenedor -> 9025 del host)
server {
    listen 9025;
    server_name _;
    access_log off;            # No registrar las visitas al reporte
    root /srv/report;
    location / {
        index report.html;
    }
}
